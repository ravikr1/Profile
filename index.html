<!DOCTYPE html>
<html>
<head>
    <title>Profile Cards</title>

    <style>
        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .card {
            width: 200px;
            padding: 10px;
            border: 1px solid black;
            text-align: center;
        }

        .card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
        }
    </style>
</head>

<body>

    <h1 style="text-align:center;">User Profiles</h1>

    <div class="cards">

        <div class="card">
            <img src="https://i.pinimg.com/736x/83/c9/05/83c905922a331734a74c4a7389b998b5.jpg">
            <h2>Sentinal</h2>
            <h3>Web Developer</h3>
            <p>I create simple websites.</p>
        </div>

        <div class="card">
            <img src="https://i.pinimg.com/236x/80/c9/10/80c9103519930f115caf18c089e51830.jpg">
            <h2>Optimus</h2>
            <h3>Designer</h3>
            <p>I design creative interfaces.</p>
        </div>

        <div class="card">
            <img src="https://i.pinimg.com/736x/40/ba/5e/40ba5e96ee43ad7e56fdb6e0994eb7fb.jpg">
            <h2>Bumblebee</h2>
            <h3>Programmer</h3>
            <p>I build programming projects.</p>
        </div>

    </div>

</body>
</html>
